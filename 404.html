<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sayfa bulunamadı — eymen.akts.tr</title>
<meta name="description" content="Aradığınız sayfa bulunamadı." />
<meta name="robots" content="noindex" />
<link href="/assets/fonts/inter.css" rel="stylesheet" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="theme-color" content="#0a0a0a" />
<style>
/* Token bloğu index.html ile aynı olmalı — orada bir renk değişirse
   burası da değişmeli. Site bilerek tek dosya olduğu için ortak CSS
   çıkarılmadı. */
:root{
  --bg:#0a0a0a;--surface:#121212;--surface-hi:#1a1a1a;
  --fg:#f5f5f5;--muted:#8e8e93;--dim:#7e7e84;
  --line:rgba(255,255,255,.08);--line-hi:rgba(255,255,255,.16);
  --accent:#26c281;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="light"]{
  --bg:#fbfbfd;--surface:#ffffff;--surface-hi:#f2f2f4;
  --fg:#111113;--muted:#6e6e73;--dim:#74747a;
  --line:rgba(0,0,0,.09);--line-hi:rgba(0,0,0,.17);
  --accent:#0f9b68;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.6;
  min-height:100dvh;display:grid;place-items:center;padding:24px;
  -webkit-font-smoothing:antialiased;
  transition:background .4s var(--ease),color .4s var(--ease);
}
a{color:inherit;text-decoration:none}

.glow{
  position:fixed;inset:0 0 auto;height:56vh;pointer-events:none;z-index:0;
  background:radial-gradient(60% 100% at 50% 0%,rgba(38,194,129,.11),transparent 70%);
}

main{position:relative;z-index:1;text-align:center;max-width:44ch}

/* Dev "404" ve alta doğru sönen maske — 21st.dev'in "not-found-2"
   bileşeninin fikri. Orada Tailwind v4'ün `mask-b-*` yardımcısıyla
   yapılıyor; burası saf CSS olduğu için doğrudan mask-image. */
.big{
  font-size:clamp(6rem,26vw,11rem);font-weight:700;line-height:.9;
  letter-spacing:-.05em;color:var(--fg);
  -webkit-mask-image:linear-gradient(to bottom,#000 22%,transparent 88%);
  mask-image:linear-gradient(to bottom,#000 22%,transparent 88%);
}
h1{margin-top:-6px;font-size:clamp(1.25rem,4vw,1.6rem);font-weight:600;letter-spacing:-.02em}
p{margin-top:12px;color:var(--muted);font-size:15px;text-wrap:balance}

.actions{margin-top:30px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--fg);
  transition:border-color .3s,background .3s,transform .2s var(--ease);
}
.btn:hover{border-color:var(--line-hi);background:var(--surface-hi)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:transparent}
.btn.primary:hover{opacity:.9;background:var(--fg)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="glow"></div>

<main>
  <div class="big" aria-hidden="true">404</div>
  <h1>Sayfa bulunamadı</h1>
  <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir.</p>
  <div class="actions">
    <a class="btn primary" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg>
      Ana sayfa
    </a>
    <a class="btn" href="https://akts.tr" target="_blank" rel="noreferrer noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
      akts.tr
    </a>
  </div>
</main>

</body>
</html>
